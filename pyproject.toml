[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Conflicts with the formatter
    "ISC001",  # Conflicts with the formatter
    "D203",  # D211 instead: no blank line before a class docstring
    "D212",  # D213 instead: the summary starts on the second line of a docstring
    "D401",  # Docstrings are descriptive ("Deletes ...", as in the Google style guide), not imperative
    "CPY001",  # No copyright header in every file
    "EM101",  # Literal messages in raise are fine
    "EM102",  # f-string messages in raise are fine
    "TRY003",  # Messages passed to exceptions are fine
]


[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "all"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false  # asyncpg and APScheduler ship no type information
reportUnusedCallResult = false  # A returned value (e.g. the Message) is used only where needed
reportImplicitStringConcatenation = false  # Contradicts Ruff ISC003, which prefers implicit concatenation to "+"

[[tool.basedpyright.executionEnvironments]]
root = "src"

# Mocks are untyped: Any/unknown values and protected access are expected in tests
[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["src"]
reportAny = false
reportExplicitAny = false
reportPrivateUsage = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingTypeArgument = false


[tool.pytest.ini_options]
pythonpath = ["src"]
python_files = ["tests/**/*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
